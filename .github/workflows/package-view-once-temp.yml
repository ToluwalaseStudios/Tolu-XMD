name: Temporary Tolu-XMD deployment package
on:
  push:
    branches: [main]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build clean source archive
        run: |
          mkdir package
          git archive HEAD | tar -x -C package
          rm -f package/.github/workflows/package-view-once-temp.yml
          find package -type f \( -name '.env' -o -name '.env.*' \) -delete
          find package -type d \( -name node_modules -o -name auth_info_baileys -o -name coverage \) -prune -exec rm -rf {} +
          find package -type d -name data -prune -exec rm -rf {} +
          cd package
          zip -qr ../Tolu-XMD-reaction-view-once.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: Tolu-XMD-reaction-view-once
          path: Tolu-XMD-reaction-view-once.zip
          if-no-files-found: error
