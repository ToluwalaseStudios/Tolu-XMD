name: Package Tolu-XMD source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-source.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create deployment ZIP
        run: |
          zip -r "$RUNNER_TEMP/Tolu-XMD-updated.zip" . \
            -x '.git/*' \
               'node_modules/*' \
               '*/node_modules/*' \
               'auth_info_baileys/*' \
               '*/auth_info_baileys/*' \
               '.env' \
               '.env.*' \
               '*/.env' \
               '*/.env.*' \
               '.github/workflows/package-source.yml' \
               'data/*' \
               '*/data/*' \\
               'Tolu-XMD-updated.zip' \\
               'Tolu-XMD-*.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: Tolu-XMD-updated
          path: ${{ runner.temp }}/Tolu-XMD-updated.zip
          retention-days: 7
