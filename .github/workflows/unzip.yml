name: Move Files to Main Folder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository files
        uses: actions/checkout@v4

      - name: Move files out of subfolder
        run: |
          shopt -s dotglob
          mv Toluwalase-XMD-Quoted-Message-Retrieval-Fix/* .
          rmdir Toluwalase-XMD-Quoted-Message-Retrieval-Fix

      - name: Save changes to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add .
          git commit -m "Move files to root directory"
          git push
