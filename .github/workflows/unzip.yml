name: Move Files to Main Folder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository files
        uses: actions/checkout@v4

      - name: Move files out of subfolder
        run: |
          rm -rf Toluwalase-XMD/.git
          rm -rf Toluwalase-XMD/.github/workflows
          cp -rf Toluwalase-XMD/. .
          rm -rf Toluwalase-XMD

      - name: Save changes to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Move Toluwalase-XMD files to root"
          git push origin HEAD
          
